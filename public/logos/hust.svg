<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 60" width="130" height="60">
  <rect width="130" height="60" fill="white" rx="6"/>
  <!-- Gear / cog emblem -->
  <circle cx="30" cy="30" r="18" fill="#e67e22"/>
  <circle cx="30" cy="30" r="11" fill="white"/>
  <circle cx="30" cy="30" r="6" fill="#e67e22"/>
  <!-- Gear teeth -->
  <rect x="27" y="10" width="6" height="6" fill="#e67e22" rx="1"/>
  <rect x="27" y="44" width="6" height="6" fill="#e67e22" rx="1"/>
  <rect x="10" y="27" width="6" height="6" fill="#e67e22" rx="1"/>
  <rect x="44" y="27" width="6" height="6" fill="#e67e22" rx="1"/>
  <!-- H letter in center -->
  <text x="30" y="35" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="white" text-anchor="middle">H</text>
  <!-- HUST text -->
  <text x="58" y="26" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#e67e22" letter-spacing="0.5">HUST</text>
  <line x1="58" y1="30" x2="120" y2="30" stroke="#e67e22" stroke-width="1"/>
  <text x="58" y="42" font-family="Arial, sans-serif" font-size="6.5" fill="#555">Hanoi Univ. Sci &amp; Tech</text>
</svg>
